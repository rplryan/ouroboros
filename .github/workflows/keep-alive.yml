name: Keep x402 Discovery API Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free tier spin-down (15 min idle timeout)
    - cron: '*/10 * * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping x402 Service Discovery API
        run: |
          echo "Pinging https://x402-discovery-api.onrender.com/ ..."
          # || true: swallow curl exit code 28 (timeout) — a slow cold start is not a failure
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 -L https://x402-discovery-api.onrender.com/ || true)
          echo "HTTP status: $RESPONSE"
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "402" ]; then
            echo "✅ Service is alive (HTTP $RESPONSE)"
          elif [ -z "$RESPONSE" ] || [ "$RESPONSE" = "000" ]; then
            echo "⏳ Service is warming up (cold start / timeout) — not a failure"
          else
            echo "⚠️ Unexpected status: $RESPONSE — service may be down"
          fi
